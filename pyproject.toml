[project]
name = "jbclock"
version = "0.2.0"
description = "A versatile digital clock for Raspberry Pi with radio, news, trains, weather, and webcam features."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=2.2.0",
    "numpy>=1.24.0",
    "opencv-python>=4.6.0",
    "python-vlc>=3.0.0",
    "requests>=2.28.0",
    "tomli-w>=1.0.0",
    "zeep>=4.2.0",
]

[project.urls]
"Homepage" = "https://github.com/wons/jbclock"

[tool.setuptools]
py-modules = [
    "alarm",
    "api_news_reader",
    "config",
    "keypad",
    "main",
    "news",
    "radio",
    "rss_news_reader",
    "server",
    "trains",
    "weather_widget",
    "webcam",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
jbclock = "main:main"

