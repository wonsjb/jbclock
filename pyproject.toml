[project]
name = "jbclock"
version = "0.1.0"
description = "A versatile digital clock for Raspberry Pi with radio, news, trains, weather, and webcam features."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt5>=5.15.0",
    "requests>=2.28.0",
    "python-vlc>=3.0.0",
    "python-dateutil>=2.8.2",
    "newsapi-python>=0.2.6",
    "beautifulsoup4>=4.9.3",
    "pygame>=2.0.0",
    "schedule>=1.1.0",
    "pytz>=2022.1",
    "opencv-python",
    "tomli",
    "tomli-w"
]

[project.urls]
"Homepage" = "https://github.com/wons/jbclock"

[tool.setuptools]
packages = ["."]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
jbclock = "main:main"

[[tool.uv.index]]
name = "piwheels"
url = "https://www.piwheels.org/simple"

[tool.uv.sources]
PyQt5 = { index = "piwheels" }
