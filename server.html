<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JbClock Remote</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --border-radius: 12px;
            --transition: all 0.2s ease;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Status Widget */
        .status-hero {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .clock-display {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }

        .now-playing {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .station-name {
            font-size: 1.25rem;
            color: var(--accent-color);
            font-weight: 500;
        }

        .track-info {
            color: var(--text-secondary);
            margin-top: 4px;
            font-size: 0.9rem;
        }

        /* Sections */
        .section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            margin-left: 4px;
        }

        /* Grid Layouts */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* Buttons */
        button {
            background-color: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid #333;
            padding: 20px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
        }

        button:hover {
            background-color: #2a2a2a;
            transform: translateY(-2px);
            border-color: #444;
        }

        button:active {
            transform: translateY(0);
        }

        /* Variant Buttons */
        .btn-primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-danger {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background-color: rgba(239, 68, 68, 0.2);
            border-color: var(--danger-color);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .clock-display {
                font-size: 2.5rem;
            }

            .container {
                gap: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Status Widget -->
        <div class="status-hero">
            <div class="clock-display" id="clock">--:--:--</div>
            <div class="now-playing">
                <div class="station-name" id="station">Unknown Station</div>
                <div class="track-info" id="track">No track info</div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="section">
            <div class="section-title">Navigation</div>
            <div class="controls-grid">
                <button onclick="toggleSetting('clock')">Clock</button>
                <button onclick="toggleSetting('news')">News</button>
                <button onclick="toggleSetting('radio')">Radio</button>
                <button onclick="toggleSetting('alarm')">Alarm</button>
                <button onclick="toggleSetting('trains')">Trains</button>
                <button onclick="toggleSetting('weather')">Weather</button>
                <button onclick="toggleSetting('webcam')">Webcam</button>
            </div>
        </div>

        <!-- Media Controls -->
        <div class="section">
            <div class="section-title">Controls</div>
            <div class="actions-grid">
                <button class="btn-primary" onclick="toggleSetting('next')">Next Station</button>
                <button class="btn-primary" onclick="toggleSetting('running')">Play / Pause</button>
            </div>
        </div>

        <!-- System -->
        <div class="section">
            <div class="section-title">System</div>
            <button class="btn-danger" onclick="toggleSetting('restart')">Restart Application</button>
        </div>
    </div>

    <script>
        function updateStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('clock').textContent = data.time || '--:--:--';
                    document.getElementById('station').textContent = data.station || 'Stopped';
                    document.getElementById('track').textContent = data.track || '';
                })
                .catch(err => console.error("Status update failed", err));
        }

        function toggleSetting(setting) {
            const endpoints = {
                'next': '/api/next_station',
                'running': '/api/toggle_running',
                'clock': '/api/set_clock',
                'news': '/api/set_news',
                'radio': '/api/set_radio',
                'alarm': '/api/set_alarm',
                'trains': '/api/set_trains',
                'weather': '/api/set_weather',
                'webcam': '/api/set_webcam',
                'restart': '/api/restart',
            };

            fetch(endpoints[setting], {
                method: 'POST'
            })
                .then(response => response.json())
                .then(() => updateStatus())
                .catch(err => console.error("Command failed", err));
        }

        // Update status often for smooth clock
        updateStatus();
        setInterval(updateStatus, 1000);
    </script>
</body>

</html>
